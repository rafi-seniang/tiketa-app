name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: tiketa
          POSTGRES_PASSWORD: tiketa-ci
          POSTGRES_DB: tiketa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tiketa -d tiketa_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      # once on SQLite, with no services. Under 90% of app/ covered fails the build
      - run: pytest -q --cov=app --cov-fail-under=90
      # and once on PostgreSQL, the database that keeps a seat from being sold twice in production
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tiketa:tiketa-ci@127.0.0.1:5432/tiketa_test
      # known vulnerabilities in any dependency fail the build
      - run: pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # a known high or critical vulnerability in any dependency fails the build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not only the last one
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiketa:${{ github.sha }} .
      - run: docker build -t tiketa-web:${{ github.sha }} web
