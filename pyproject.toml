[project]
name = "tiketa"
version = "2.0.0"
description = "Tiketa's booking core: films, weekly showtimes, seats and bookings behind one API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160",
    "uvicorn[standard]>=0.50",
    "pydantic>=2.11",
    "pydantic-settings>=2.12",
    "sqlalchemy[asyncio]>=2.1",
    "alembic==1.20.1",
    "psycopg[binary]>=3.3",
    "aiosqlite>=0.22",
    "redis>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "pip-audit==2.10.1",
    "ruff>=0.15",
    "mypy>=2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "app", "scripts"]
strict = true
plugins = ["pydantic.mypy"]
